<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud Recibida — Tío Danny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0A0A0A;
  --text-primary: #F5F0E8;
  --text-secondary: #A09888;
  --accent: #C8956C;
  --accent-bright: #E8B48A;
  --accent-glow: rgba(200, 149, 108, 0.15);
  --border: rgba(200, 149, 108, 0.12);
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
  line-height: 1.6;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 1.5rem 2rem;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
  background: linear-gradient(to bottom, rgba(10,10,10,0.95), transparent);
}
.nav-logo {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1.1rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-primary);
  text-decoration: none;
}
.nav-logo span { color: var(--accent); }
.confirmation {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4rem 2rem;
}
.confirmation-inner { max-width: 600px; }
.confirmation-icon {
  width: 80px; height: 80px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 2rem;
  font-size: 2rem;
  color: var(--accent);
  animation: scaleIn 0.6s 0.2s forwards;
  opacity: 0;
}
.confirmation h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2rem, 4vw, 2.8rem);
  margin-bottom: 1.5rem;
  opacity: 0;
  animation: fadeUp 0.8s 0.4s forwards;
}
.confirmation p {
  font-size: 1.1rem;
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 2.5rem;
  opacity: 0;
  animation: fadeUp 0.8s 0.6s forwards;
}
.back-link {
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 0.8rem 2.5rem;
  text-decoration: none;
  transition: all 0.3s ease;
  opacity: 0;
  animation: fadeUp 0.8s 0.8s forwards;
}
.back-link:hover {
  background: var(--accent);
  color: var(--bg-primary);
}
.footer {
  padding: 3rem 2rem;
  text-align: center;
  border-top: 1px solid var(--border);
}
.footer p { font-size: 0.8rem; color: var(--text-secondary); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo">Tío <span>Danny</span></a>
</nav>
<section class="confirmation">
  <div class="confirmation-inner">
    <div class="confirmation-icon">✓</div>
    <h1>Solicitud recibida.</h1>
    <p>Revisaré tu información y estaré en contacto contigo en las próximas 48 horas si hay compatibilidad.</p>
    <a href="/" class="back-link">← Volver al inicio</a>
  </div>
</section>
<footer class="footer">
  <p>© 2026 Tío Danny · Social Plug (TDC LLC) · Puerto Rico</p>
</footer>
</body>
</html>
