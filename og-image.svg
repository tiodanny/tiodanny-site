<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#161616"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:rgba(200,149,108,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(200,149,108,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="rgba(200,149,108,0.15)" stroke-width="1"/>

  <!-- Accent top line -->
  <rect x="80" y="80" width="60" height="2" fill="#C8956C"/>

  <!-- Tag label -->
  <text x="80" y="140" font-family="Georgia, serif" font-size="13" font-weight="600" letter-spacing="4" fill="#C8956C" text-anchor="start">ESTRATEGIA DE CONTENIDO · DIRECCIÓN CREATIVA</text>

  <!-- Main name -->
  <text x="80" y="260" font-family="Georgia, serif" font-size="96" font-weight="900" fill="#F5F0E8" text-anchor="start" letter-spacing="2">TÍO</text>
  <text x="80" y="360" font-family="Georgia, serif" font-size="96" font-weight="900" fill="#C8956C" text-anchor="start" letter-spacing="2" font-style="italic">DANNY</text>

  <!-- Divider line -->
  <rect x="80" y="400" width="500" height="1" fill="rgba(200,149,108,0.3)"/>

  <!-- Tagline -->
  <text x="80" y="450" font-family="Georgia, serif" font-size="22" font-weight="300" fill="#A09888" text-anchor="start" letter-spacing="1">Estrategia + Intención + Emoción</text>

  <!-- Stats -->
  <text x="80" y="520" font-family="Georgia, serif" font-size="17" fill="#A09888" letter-spacing="1">130M+ views orgánicos · 850K+ seguidores · Puerto Rico</text>

  <!-- URL bottom right -->
  <text x="1120" y="560" font-family="Georgia, serif" font-size="16" fill="rgba(200,149,108,0.6)" text-anchor="end" letter-spacing="2">tiodanny.com</text>
</svg>
